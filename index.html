<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TallUp — Legal</title>
<style>
  :root { --emerald: #059669; --emerald-dark: #065f46; --ink: #111827; --muted: #6b7280; --line: #d1fae5; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 0; background: #ecfdf5; color: var(--ink);
         font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
         line-height: 1.65; font-size: 16px; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 48px 20px 64px; }
  header { text-align: center; margin-bottom: 28px; }
  header img { width: 72px; height: 72px; border-radius: 20px; box-shadow: 0 6px 20px rgba(6,78,59,.18); }
  header .brand { display: block; margin-top: 10px; font-weight: 800; color: var(--emerald-dark); letter-spacing: .02em; }
  h1 { font-size: 26px; margin: 0 0 6px; text-align: center; }
  .sub { text-align: center; color: var(--muted); margin: 0 0 24px; }
  .card { display: block; background: #fff; border-radius: 24px; padding: 22px 24px; margin-bottom: 14px;
          box-shadow: 0 4px 24px rgba(6,78,59,.08); text-decoration: none; color: var(--ink); }
  .card:hover { box-shadow: 0 8px 28px rgba(6,78,59,.14); }
  .card strong { display: block; font-size: 17px; color: var(--emerald-dark); }
  .card span { color: var(--muted); font-size: 14px; }
  footer { text-align: center; color: #9ca3af; font-size: 12.5px; margin-top: 28px; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <img src="brand/icon.svg" alt="TallUp" />
      <span class="brand">TallUp</span>
    </header>
    <h1>Legal</h1>
    <p class="sub">Policies and account information for the TallUp app.</p>
    <a class="card" href="privacy.html">
      <strong>Privacy Policy</strong>
      <span>How TallUp collects, uses, and protects your data.</span>
    </a>
    <a class="card" href="terms.html">
      <strong>Terms of Use</strong>
      <span>The rules and conditions for using TallUp.</span>
    </a>
    <a class="card" href="delete-account.html">
      <strong>Delete Your Account</strong>
      <span>How to request deletion of your TallUp account and data.</span>
    </a>
    <footer>&copy; TallUp. All rights reserved.</footer>
  </div>
</body>
</html>
